[project]
name = "aprendiz"
version = "0.1.0"
description = "Agente que opera escritorios solo por pantalla (VNC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "websockets",
    "pycryptodome",
    "pillow",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
aprendiz-api = "aprendiz.api:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aprendiz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]
extend-exclude = ["experiments", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
